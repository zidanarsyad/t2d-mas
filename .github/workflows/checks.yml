# Fresh-install checks on Windows and Linux for every push and pull request, so a teammate's
# clone keeps working. The steps match "Run it" and "Checks" in README.md.
name: Checks

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: python -m pip install -r agents/requirements.txt
      - run: python -m pytest agents/tests -q

  dashboard:
    name: Dashboard tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
